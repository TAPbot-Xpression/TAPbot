<!DOCTYPE html>
<html lang="en" data-color-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPbot - Standings &amp; Polls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Color System & Default Theme (Dark) ─────────────────────────────────── */
    :root {
      --bg:             #080c14;
      --surface:        #0f1623;
      --surface-2:      #161f30;
      --surface-3:      #1d2840;
      --border:         #1e2d47;
      --border-light:   #2a3d5c;

      --team-primary:   #5b2d86;
      --team-accent:    #8b5cf6;
      --team-glow:      rgba(139, 92, 246, 0.35);
      --team-light:     #ddd6fe;
      --team-btn-text:  #ffffff;
      --ust-highlight:  rgba(139, 92, 246, 0.18);

      --gold:           #fbbf24;
      --gold-bg:        rgba(251, 191, 36, 0.14);
      --silver:         #e2e8f0;
      --silver-bg:      rgba(226, 232, 240, 0.14);
      --bronze:         #f97316;
      --bronze-bg:      rgba(249, 115, 22, 0.14);

      --text:           #e8edf5;
      --text-muted:     #8a9fb8;
      --text-faint:     #4d627d;

      --green:          #10b981;
      --red:            #ef4444;
      --amber:          #f59e0b;

      --badge-ok-bg:    rgba(16, 185, 129, 0.15);
      --badge-ok-txt:   #34d399;
      --badge-stale-bg: rgba(245, 158, 11, 0.15);
      --badge-stale-txt:#fbbf24;
      --badge-error-bg: rgba(239, 68, 68, 0.15);
      --badge-error-txt:#f87171;

      --radius:         12px;
      --radius-sm:      8px;
    }

    /* ── Light Mode Color Overrides ─────────────────────────────────────────── */
    [data-color-mode="light"] {
      --bg:             #f8fafc;
      --surface:        #ffffff;
      --surface-2:      #f1f5f9;
      --surface-3:      #e2e8f0;
      --border:         #cbd5e1;
      --border-light:   #94a3b8;

      --text:           #0f172a;
      --text-muted:     #475569;
      --text-faint:     #94a3b8;

      --team-light:     #7c3aed;
      --ust-highlight:  rgba(139, 92, 246, 0.12);

      --badge-ok-bg:    #dcfce7;
      --badge-ok-txt:   #15803d;
      --badge-stale-bg: #fef9c3;
      --badge-stale-txt:#a16207;
      --badge-error-bg: #fee2e2;
      --badge-error-txt:#b91c1c;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1.5rem 4.5rem;
      transition: background-color 0.25s, color 0.25s;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── TAPbot Back Button ─────────────────────────────────────────────────── */
    .tap-back {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      margin: 0 0 1.25rem;
      padding: .45rem .85rem;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 999px;
      color: var(--text-muted);
      font: 700 .82rem/1 'JetBrains Mono', monospace;
      letter-spacing: .04em;
      text-decoration: none;
      transition: color .15s, border-color .15s, box-shadow .15s;
    }
    .tap-back:hover,
    .tap-back:focus-visible {
      color: var(--text);
      border-color: var(--team-accent);
      box-shadow: 0 0 10px var(--team-glow);
    }
    .tap-back:focus-visible { outline: 2px solid var(--team-accent); outline-offset: 3px; }
    .tap-back-arrow { transition: transform .15s; }
    .tap-back:hover .tap-back-arrow { transform: translateX(-3px); }

    /* ── Header ───────────────────────────────────────────────────────────────── */
    header {
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
      flex: 1 1 auto;
    }

    .wordmark-eyebrow {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--team-accent);
      font-family: 'JetBrains Mono', monospace;
    }

    h1 {
      font-size: clamp(1.45rem, 2.4vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--text);
    }

    .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.35rem;
      line-height: 1.4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.65rem;
    }
    .meta b {
      color: var(--text);
      font-weight: 700;
    }
    .meta .meta-sep {
      color: var(--border-light);
    }

    /* ── Header Right Controls (Theme Switcher) ──────────────────────────────── */
    .header-right-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .control-pill-group {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 9px;
      gap: 3px;
    }

    .control-pill-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .control-pill-btn:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    /* ── Controls Bar ─────────────────────────────────────────────────────────── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 0.85rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .filter-btn {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      font-family: inherit;
    }

    .filter-btn:hover:not(.active) {
      color: var(--text);
      background: var(--surface-3);
      border-color: var(--border-light);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--team-primary) 0%, var(--surface-3) 100%);
      border-color: var(--team-accent);
      color: #ffffff;
      box-shadow: 0 0 18px var(--team-glow), inset 0 1px 1px rgba(255,255,255,0.2);
    }

    .site-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 0.95rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      color: var(--team-accent);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }

    .site-link-btn:hover {
      background: var(--team-accent);
      color: var(--team-btn-text, #ffffff);
      border-color: var(--team-accent);
      box-shadow: 0 0 12px var(--team-glow);
    }

    /* ── Grid ─────────────────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.75rem;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      width: 100%;
    }

    .card:hover {
      border-color: var(--border-light);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    /* ── Card Header ──────────────────────────────────────────────────────────── */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1.35rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .card-league {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--team-accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-header-right {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* Per-Card Timestamp Pill */
    .card-time-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--surface-3);
      border: 1px solid var(--border);
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .card-time-pill b {
      color: var(--text);
      font-weight: 700;
    }
    .card-time-pill .card-sep {
      color: var(--border-light);
    }

    .card-source-link {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--team-accent);
      text-decoration: none;
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .card-source-link:hover {
      background: var(--team-accent);
      color: var(--team-btn-text, #ffffff);
      box-shadow: 0 0 8px var(--team-glow);
    }

    .badge {
      font-size: 0.72rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-ok     { background: var(--badge-ok-bg);    color: var(--badge-ok-txt); }
    .badge-stale  { background: var(--badge-stale-bg); color: var(--badge-stale-txt); }
    .badge-error  { background: var(--badge-error-bg); color: var(--badge-error-txt); }

    /* ── Table ────────────────────────────────────────────────────────────────── */
    .table-wrap {
      width: 100%;
      flex: 1;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead th {
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.8rem 0.9rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      text-align: left;
    }

    thead th.num { text-align: center; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }

    tbody tr.highlight-ust {
      background: var(--ust-highlight) !important;
    }

    tbody tr.highlight-ust .team-name {
      color: var(--team-accent);
      font-weight: 700;
    }

    td {
      padding: 0.75rem 0.9rem;
      vertical-align: middle;
    }

    td.rank {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 800;
      text-align: center;
      width: 44px;
      font-family: 'JetBrains Mono', monospace;
    }

    .rank-top3 { color: var(--gold) !important; }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .team-acronym {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.18rem 0.45rem;
      border-radius: 4px;
      background: var(--surface-3);
      color: var(--text);
      letter-spacing: 0.04em;
      display: inline-block;
      text-align: center;
      min-width: 42px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border);
    }

    .highlight-ust .team-acronym {
      background: var(--team-primary);
      color: #ffffff;
      box-shadow: 0 0 8px var(--team-glow);
      border-color: var(--team-accent);
    }

    .team-name {
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
    }

    td.record {
      text-align: center;
      font-size: 0.92rem;
      color: var(--text);
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }

    td.pts-col {
      text-align: center;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--team-accent);
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }

    td.trend-cell { text-align: center; width: 62px; font-family: 'JetBrains Mono', monospace; }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .trend-up   { color: var(--green); background: rgba(16, 185, 129, 0.15); }
    .trend-down { color: var(--red);   background: rgba(239, 68, 68, 0.15); }
    .trend-same { color: var(--text-faint); }
    .trend-new  { color: var(--gold);  background: var(--gold-bg); }

    .poll-date-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-3);
      border: 1px solid var(--border);
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      margin-left: 0.5rem;
      vertical-align: middle;
      font-family: 'JetBrains Mono', monospace;
    }

    .message {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .message-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    /* ── Page Footer ──────────────────────────────────────────────────────────── */
    footer {
      margin-top: 3.5rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.92rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    footer a {
      color: var(--team-accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">

    <!-- TAPbot: back to Hub Site -->
    <a class="tap-back" href="../index.html" aria-label="Back to TAPbot Hub Site">
      <span class="tap-back-arrow" aria-hidden="true">←</span> TAPbot Hub
    </a>

    <!-- Header -->
    <header>
      <div class="wordmark">
        <span class="wordmark-eyebrow" id="eyebrowText">Tommie Athletic Productions Broadcast Operations Tool · 2026-27 Season</span>
        <h1 id="pageTitle">Standings &amp; Polls</h1>
        <div class="meta" id="last-generated-time">
          <span>Loading feed timestamps…</span>
        </div>
      </div>

      <div class="header-right-controls">
        <div class="control-pill-group" role="group" aria-label="Theme Selection">
          <button id="btnThemeToggle" class="control-pill-btn" onclick="toggleColorMode()">
            <span id="themeToggleLabel">🌙 Dark</span>
          </button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="filter-group" id="filter-buttons">
        <button class="filter-btn active" data-filter="all">All Sports</button>
        <button class="filter-btn" data-filter="fall">Fall</button>
        <button class="filter-btn" data-filter="winter">Winter</button>
        <button class="filter-btn" data-filter="spring">Spring</button>
      </div>
      <div>
        <a href="data.json" target="_blank" rel="noopener noreferrer" class="site-link-btn">
          data.json ↗
        </a>
      </div>
    </div>

    <div class="grid" id="sports-grid">
      <div class="card" style="grid-column: 1 / -1;">
        <div class="message">
          <span class="message-icon">⏳</span>
          Loading live standings and polls from data.json…
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-main">
        <a href="https://github.com/TAPbot-Xpression/TAPbot" target="_blank" rel="noopener noreferrer">
          TAPbot · Developed by St. Thomas Athletics · Hosted on GitHub
        </a>
      </div>
    </footer>

  </div>

  <script>
    let sportsData = {};
    let activeFilter = "all";

    const DISPLAY_ORDER = [
      "wsoc", "msoc", "pfl", "wvball",
      "whockey", "uscho_womens_poll",
      "mhockey", "uscho_mens_poll",
      "wbball", "mbball",
      "baseball", "summit_193", "bsb",
      "softball", "summit_195", "sball"
    ];

    const SEASON_MAP = {
      wsoc: "fall", msoc: "fall", pfl: "fall", wvball: "fall",
      whockey: "winter", uscho_womens_poll: "winter",
      mhockey: "winter", uscho_mens_poll: "winter",
      wbball: "winter", mbball: "winter",
      summit_193: "spring", baseball: "spring", bsb: "spring",
      summit_195: "spring", softball: "spring", sball: "spring"
    };

    // ── Time & Timestamp Helpers ───────────────────────────────────────────────
    function ago(ms) {
      if (ms === null || isNaN(ms)) return '—';
      const m = Math.round(Math.max(ms, 0) / 60000);
      if (m < 60) return `${Math.max(m, 1)}m ago`;
      const h = Math.round(m / 60);
      if (h < 48) return `${h}h ago`;
      return `${Math.round(h / 24)}d ago`;
    }

    function parseIso(val) {
      if (!val || typeof val !== 'string') return null;
      const t = Date.parse(val);
      return isNaN(t) ? null : t;
    }

    function getFeedTimestamps(feedObj, topPayload) {
      const scanRaw = feedObj?.last_scan || feedObj?.updated_at || topPayload?.last_scan || topPayload?.generated_at;
      const dataRaw = feedObj?.last_updated || feedObj?.updated_at || topPayload?.last_updated || topPayload?.generated_at;

      const scanTime = parseIso(scanRaw);
      const dataTime = parseIso(dataRaw);

      return {
        scanTime,
        dataTime,
        scanAge: scanTime ? Date.now() - scanTime : null,
        dataAge: dataTime ? Date.now() - dataTime : null,
      };
    }

    // ── Theme Switcher ─────────────────────────────────────────────────────────
    function toggleColorMode() {
      const htmlEl = document.documentElement;
      const currentMode = htmlEl.getAttribute('data-color-mode') || 'dark';
      const nextMode = currentMode === 'dark' ? 'light' : 'dark';
      applyColorMode(nextMode);
    }

    function applyColorMode(mode) {
      document.documentElement.setAttribute('data-color-mode', mode);
      const label = document.getElementById('themeToggleLabel');
      if (label) label.textContent = mode === 'dark' ? '🌙 Dark' : '☀️ Light';
      try { localStorage.setItem('tap_color_mode', mode); } catch (e) {}
    }

    async function loadData() {
      const grid = document.getElementById("sports-grid");
      const metaTime = document.getElementById("last-generated-time");

      try {
        const res = await fetch("data.json?_=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        sportsData = data.sports || {};

        // Top-Level Scan & Data Timestamps
        const topScanRaw = data.last_scan || data.generated_at;
        const topDataRaw = data.last_updated || data.generated_at;

        const topScanTime = parseIso(topScanRaw);
        const topDataTime = parseIso(topDataRaw);

        if (topScanTime || topDataTime) {
          const scanAgoStr = topScanTime ? ago(Date.now() - topScanTime) : '—';
          const dataAgoStr = topDataTime ? ago(Date.now() - topDataTime) : '—';

          metaTime.innerHTML = `
            <span>Last Scan: <b>${scanAgoStr}</b></span>
            <span class="meta-sep">·</span>
            <span>Last Data Update: <b>${dataAgoStr}</b></span>
          `;
        } else {
          metaTime.textContent = "Feed loaded";
        }

        renderGrid(data);
      } catch (err) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">
              <span class="message-icon">⚠️</span>
              Could not load feed: ${err.message}<br/>
              <small style="color:var(--text-muted); margin-top:0.5rem; display:block;">Ensure data.json is in the docs/standings/ directory.</small>
            </div>
          </div>
        `;
        metaTime.textContent = "Connection error";
      }
    }

    function getSeasonCategory(sportId, sportObj) {
      if (SEASON_MAP[sportId]) return SEASON_MAP[sportId];

      const name = (sportObj && sportObj.name ? sportObj.name : sportId).toLowerCase();

      if (name.includes("baseball") || name.includes("softball") ||
          name.includes("track") || name.includes("golf") ||
          name.includes("tennis") || sportId.startsWith("summit_19")) return "spring";

      if (name.includes("hockey") || name.includes("basketball") ||
          name.includes("swim")) return "winter";

      if (name.includes("soccer") || name.includes("football") ||
          name.includes("volleyball") || name.includes("cross country")) return "fall";

      return "other";
    }

    function cleanSportTitle(id, rawName) {
      if (id === "pfl") return "Football";
      if (id === "whockey") return "Women's Hockey";
      if (id === "mhockey") return "Men's Hockey";
      if (!rawName) return id;
      return rawName.replace(/^Summit League\s+/i, '').trim();
    }

    function getLeagueLabel(id) {
      if (id === "pfl") return "Pioneer Football League";
      if (id === "mhockey") return "NCHC Men's Ice Hockey";
      if (id === "whockey") return "WCHA Women's Ice Hockey";
      if (id === "uscho_mens_poll" || id === "uscho_womens_poll") return "National Ranking · USCHO";
      return "Summit League";
    }

    function renderGrid(topPayload = {}) {
      const grid = document.getElementById("sports-grid");

      const knownKeys = DISPLAY_ORDER.filter(id => sportsData[id]);
      const remainingKeys = Object.keys(sportsData).filter(id => !DISPLAY_ORDER.includes(id));
      const sortedKeys = [...knownKeys, ...remainingKeys];

      if (sortedKeys.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><div class="message">No sport standings or polls available in feed.</div></div>`;
        return;
      }

      const filtered = sortedKeys.filter(id => {
        if (activeFilter === "all") return true;
        return getSeasonCategory(id, sportsData[id]) === activeFilter;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><div class="message">No tables found for this season filter.</div></div>`;
        return;
      }

      grid.innerHTML = filtered.map(id => buildCard(id, sportsData[id], topPayload)).join("");
    }

    function buildCard(id, s, topPayload = {}) {
      const isError = s.status === "error" || !s.rows || s.rows.length === 0;
      const isStale = s.status === "stale";
      const isPoll  = id.includes("poll") || s.type === "poll";
      const isNCHC  = id === "mhockey";

      let badgeClass = "badge-ok";
      let badgeText  = isPoll ? "National Poll" : "Live";
      if (isError) { badgeClass = "badge-error"; badgeText = "Off Season / Error"; }
      else if (isStale) { badgeClass = "badge-stale"; badgeText = "⚠ Stale"; }

      const sourceLinkText = isPoll ? "Official USCHO Poll ↗" : "Official Standings ↗";
      const sourceLink = s.source
        ? `<a href="${escHtml(s.source)}" target="_blank" rel="noopener noreferrer" class="card-source-link">${sourceLinkText}</a>`
        : "";

      // Feed-specific Scan and Data timestamps
      const { scanAge, dataAge } = getFeedTimestamps(s, topPayload);
      const timePill = (scanAge !== null || dataAge !== null)
        ? `<div class="card-time-pill" title="Scan: ${ago(scanAge)} | Data: ${ago(dataAge)}">
             <span>Scan: <b>${ago(scanAge)}</b></span>
             <span class="card-sep">|</span>
             <span>Data: <b>${ago(dataAge)}</b></span>
           </div>`
        : "";

      let bodyContent = "";

      if (isError) {
        bodyContent = `
          <div class="message">
            <span class="message-icon">📋</span>
            ${escHtml(s.error || "No current active data found.")}
          </div>`;

      } else if (isPoll) {
        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num">Record</th>
                  <th class="num pts-col">Pts (1st)</th>
                  <th class="num">Last</th>
                  <th class="num">Chg</th>
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST     = r.team && r.team.toLowerCase().includes("st. thomas");
                  const top3Class = r.rank <= 3 ? "rank-top3" : "";
                  let trendClass  = "trend-same";
                  let trendSymbol = r.trend || "=";
                  if (r.trend_dir === "up")        { trendClass = "trend-up";   trendSymbol = `▲ ${String(r.trend).replace('+', '')}`; }
                  else if (r.trend_dir === "down") { trendClass = "trend-down"; trendSymbol = `▼ ${String(r.trend).replace('-', '')}`; }
                  else if (r.trend_dir === "new")  { trendClass = "trend-new";  trendSymbol = "NEW"; }
                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank ${top3Class}">${r.rank}</td>
                      <td><div class="team-cell"><span class="team-name">${escHtml(r.team)}</span></div></td>
                      <td class="record">${escHtml(r.record || '—')}</td>
                      <td class="pts-col">${escHtml(r.pts || '—')}</td>
                      <td class="record">${escHtml(r.last_poll || 'NR')}</td>
                      <td class="trend-cell"><span class="trend-badge ${trendClass}">${trendSymbol}</span></td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;

      } else if (isNCHC) {
        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num pts-col">PTS</th>
                  <th class="num">Conf GP</th>
                  <th class="num">Conf</th>
                  <th class="num">OW-OL-SW</th>
                  <th class="num">Overall</th>
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST = r.acronym === "UST" || (r.team && r.team.toLowerCase().includes("st. thomas"));
                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank">${r.rank}</td>
                      <td><div class="team-cell">
                        <span class="team-acronym">${escHtml(r.acronym || '—')}</span>
                        <span class="team-name">${escHtml(r.team)}</span>
                      </div></td>
                      <td class="pts-col">${escHtml(r.pts ?? '0')}</td>
                      <td class="record">${escHtml(r.gp ?? '0')}</td>
                      <td class="record">${escHtml(r.conf || '—')}</td>
                      <td class="record">${escHtml(r.ow_ol_sw || '0-0-0')}</td>
                      <td class="record">${escHtml(r.ovr || '—')}</td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;

      } else {
        const hasCpts   = s.rows && s.rows.some(r => r.cpts !== undefined);
        const hasPts    = s.rows && s.rows.some(r => r.pts !== undefined);
        const ptsHeader = hasCpts ? "CPTS" : (hasPts ? "PTS" : null);

        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num">Conf</th>
                  <th class="num">Overall</th>
                  ${ptsHeader ? `<th class="num pts-col">${ptsHeader}</th>` : ""}
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST  = r.acronym === "UST" || (r.team && r.team.toLowerCase().includes("st. thomas"));
                  const ptsVal = hasCpts ? (r.cpts ?? "—") : (hasPts ? (r.pts ?? "—") : null);
                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank">${r.rank}</td>
                      <td><div class="team-cell">
                        <span class="team-acronym">${escHtml(r.acronym || '—')}</span>
                        <span class="team-name">${escHtml(r.team)}</span>
                      </div></td>
                      <td class="record">${escHtml(r.conf)}</td>
                      <td class="record">${escHtml(r.ovr)}</td>
                      ${ptsHeader ? `<td class="pts-col">${escHtml(ptsVal)}</td>` : ""}
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      }

      const displayTitle = cleanSportTitle(id, s.name);
      const dateBadge    = s.poll_date ? `<span class="poll-date-badge">${escHtml(s.poll_date)}</span>` : "";

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title-group">
              <div class="card-league">${escHtml(getLeagueLabel(id))}</div>
              <h2 class="card-title">${escHtml(displayTitle)}${dateBadge}</h2>
            </div>
            <div class="card-header-right">
              ${timePill}
              ${sourceLink}
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
          </div>
          ${bodyContent}
        </div>`;
    }

    function escHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    try {
      const savedMode = localStorage.getItem('tap_color_mode') || 'dark';
      applyColorMode(savedMode);
    } catch (e) {}

    loadData();
  </script>

</body>
</html>
