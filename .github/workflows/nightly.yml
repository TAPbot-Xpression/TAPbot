name: Nightly Scrape All

# Place this file at: .github/workflows/nightly.yml
# Runs all 6 scrapers sequentially every morning at 3:30 AM Central.
# One schedule, one browser install, one commit at the end.
#
# GitHub scheduled runs are best-effort and can start late. Nothing in this
# file depends on the exact start time, so a late run still does the full job.

on:
  schedule:
    - cron: "30 3 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "scrapers/**/requirements.txt"

      # NOTE: These are unpinned, so a new release can change scraper behavior
      # without warning. Later, move them into a pinned root requirements file
      # and point cache-dependency-path at it.
      - name: Install shared dependencies
        run: |
          pip install playwright beautifulsoup4 requests lxml

      - name: Get Playwright version
        id: pw
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      # ── Scrapers ───────────────────────────────────────────────────
      # continue-on-error lets one failure skip nothing else. Each step has
      # an id so the final check can report failures, and its own timeout so
      # one hung scraper can't use up the whole job limit.

      # ── 1. Basketball ──────────────────────────────────────────────
      - name: Scrape Basketball
        id: basketball
        continue-on-error: true
        timeout-minutes: 8
        run: python scrapers/basketball/scrape_basketball.py

      # ── 2. Hockey ──────────────────────────────────────────────────
      - name: Scrape Hockey
        id: hockey
        continue-on-error: true
        timeout-minutes: 8
        run: python scrapers/hockey/scrape_hockey.py

      # ── 3. Volleyball ──────────────────────────────────────────────
      - name: Scrape Volleyball
        id: volleyball
        continue-on-error: true
        timeout-minutes: 8
        run: python scrapers/volleyball/scrape_volleyball.py

      # ── 4. Diamond Sports ──────────────────────────────────────────
      - name: Scrape Diamond Sports
        id: diamond
        continue-on-error: true
        timeout-minutes: 8
        run: python scrapers/diamondsports/scrape_diamond_sports.py

      # ── 5. Standings ───────────────────────────────────────────────
      - name: Scrape Standings
        id: standings
        continue-on-error: true
        timeout-minutes: 8
        run: python scrapers/standings/scrape_standings.py

      # ── 6. Schedules ───────────────────────────────────────────────
      - name: Scrape Schedules
        id: schedules
        continue-on-error: true
        timeout-minutes: 8
        run: python others/schedulers/schedule_scrape_all.py

      # ── Commit all updated JSONs in one shot ───────────────────────
      # Runs even when a scraper failed, so good data from the others ships.
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes across any sport."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: nightly stats update [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # -X theirs: if a rebase conflicts, keep the freshly generated JSON
          # from this run. Abort between attempts so a failed rebase can't
          # poison the next one.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done

          echo "Could not push after 5 attempts."
          exit 1

      # ── Report scraper failures ────────────────────────────────────
      # Without this, the run shows green even if every scraper failed.
      - name: Fail run if any scraper failed
        if: always()
        run: |
          bad=""
          for r in \
            "basketball=${{ steps.basketball.outcome }}" \
            "hockey=${{ steps.hockey.outcome }}" \
            "volleyball=${{ steps.volleyball.outcome }}" \
            "diamond=${{ steps.diamond.outcome }}" \
            "standings=${{ steps.standings.outcome }}" \
            "schedules=${{ steps.schedules.outcome }}"; do
            echo "$r"
            case "$r" in
              *=failure) bad=1 ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::One or more scrapers failed. See the step results above."
            exit 1
          fi

  deploy:
    needs: scrape-all
    # !cancelled() lets good data deploy even when the scrape job is red
    # because one scraper failed. Deploys only when something was pushed.
    if: ${{ !cancelled() && needs.scrape-all.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
