name: Nightly Scrape All

# Runs all 5 scrapers sequentially every morning at 3:30 AM Central.
# One schedule, one browser install, one commit at the end.

on:
  schedule:
    - cron: "30 3 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "scrapers/**/requirements.txt"

      - name: Install shared dependencies
        run: |
          pip install playwright beautifulsoup4 requests lxml

      - name: Get Playwright version
        id: pw
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      # ── 1. Basketball ──────────────────────────────────────────────
      - name: Scrape Basketball
        continue-on-error: true
        run: python scrapers/basketball/scrape_basketball.py

      # ── 2. Hockey ──────────────────────────────────────────────────
      - name: Scrape Hockey
        continue-on-error: true
        run: python scrapers/hockey/scrape_hockey.py

      # ── 3. Diamond Sports ──────────────────────────────────────────
      - name: Scrape Diamond Sports
        continue-on-error: true
        run: python scrapers/diamond_sports/scrape_diamond_sports.py

      # ── 4. Standings ───────────────────────────────────────────────
      - name: Scrape Standings
        continue-on-error: true
        run: python scrapers/standings/scrape_standings.py

      # ── 5. Schedules ───────────────────────────────────────────────
      - name: Scrape Schedules
        continue-on-error: true
        run: python others/schedulers/schedule_scrape_all.py

      # ── Commit all updated JSONs in one shot ───────────────────────
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes across any sport."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: nightly stats update [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

  deploy:
    needs: scrape-all
    if: needs.scrape-all.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
