# Place this file at: .github/workflows/schedule_scrapers.yml (replaces the existing one)
#
# Runs the unified schedule scraper (all sports, North + South Campus) every morning
# at 4:00 AM Central, copies the JSON into docs/schedulers/, commits it to main,
# then calls the shared deploy.yml so GitHub Pages publishes the new file.
#
# Scraper lives in: others/schedulers/schedule_scrape_all.py
# Published JSON:   docs/schedulers/all_schedules.json

name: Scrape Schedules

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      # only schedule scraper changes trigger this workflow
      - "others/schedulers/**"
      - ".github/workflows/schedule_scrapers.yml"

permissions:
  contents: write

concurrency:
  group: schedule-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Check Central time
        id: tz
        run: |
          # Manual runs and push runs always go. Scheduled runs only go at 4 AM Central.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=America/Chicago date +%H)
          echo "Central hour is $HOUR"
          if [ "$HOUR" = "04" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not 4 AM Central. Skipping this run."
          fi

      - name: Checkout repository
        if: steps.tz.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.tz.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scraper uses only the Python standard library, so there is nothing to pip install.
      # It reads config_all.txt (or falls back to config.txt) from its own folder.
      - name: Run unified schedule scraper
        if: steps.tz.outputs.go == 'true'
        run: python others/schedulers/schedule_scrape_all.py

      - name: Copy JSON into docs/schedulers
        if: always() && steps.tz.outputs.go == 'true'
        run: |
          mkdir -p docs/schedulers
          f="all_schedules.json"
          if [ -f "others/schedulers/$f" ]; then
            cp "others/schedulers/$f" "docs/schedulers/$f"
            echo "Copied $f"
          else
            echo "$f was not created. Keeping the previous version, if any."
          fi

      - name: Commit JSON
        id: commit
        if: always() && steps.tz.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schedulers
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(schedulers): update schedules [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Other sport workflows may push at the same time, so retry with a rebase.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
