# Save this file in your repo at: .github/workflows/schedule_scrapers.yml
#
# Runs the North Campus and South Campus schedule scrapers every morning
# at 4:00 AM CST, then commits the updated JSON files back to the repo.

name: Schedule Scrapers

on:
  schedule:
    # GitHub cron runs in UTC. 10:00 UTC = 4:00 AM CST (UTC-6).
    # During daylight saving (CDT, UTC-5) this fires at 5:00 AM Central.
    - cron: "0 10 * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can test it manually

permissions:
  contents: write      # needed so the workflow can commit the JSON files

concurrency:
  group: schedule-scrapers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run North Campus scraper
        run: python schedule_scrape_northcampus.py

      # if: always() means South Campus still runs even if North Campus fails
      - name: Run South Campus scraper
        if: always()
        run: python schedule_scrape_southcampus.py

      - name: Commit updated schedule files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule_northcampus.json || true
          git add schedule_southcampus.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update schedules $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
