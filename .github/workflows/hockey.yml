name: Scrape Hockey

# Place this file at: .github/workflows/hockey.yml
#
# Scrapes NCHC men's + WCHA women's hockey stats, commits JSON to docs/hockey/,
# then calls the shared deploy.yml.
#
# Runs every morning at about 4:30 AM Central (CST or CDT, depending on daylight saving).
#
# GitHub cron is UTC only and has no daylight saving support, so the run is
# scheduled twice. The "gate" job lets only the run that lands in the
# 4:25 to 5:15 AM Central window continue. The other one shows as skipped (this is normal).
#
#   Cron (UTC)   In winter (CST, UTC-6)   In summer (CDT, UTC-5)
#   09:30        3:30 AM  -> skipped      4:30 AM  -> runs
#   10:30        4:30 AM  -> runs         5:30 AM  -> skipped
#
# The two crons are exactly one hour apart, so the window can tolerate a start
# delay of up to 45 minutes and still never match the wrong cron.

on:
  workflow_dispatch:
    inputs:
      only_teams:
        description: "Teams to scrape (e.g. 'St. Thomas,Denver') or blank for all"
        required: false
        default: ""
        type: string
      enable_debug:
        description: "Save raw debug HTML snapshots (uploaded as an artifact)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:                          # only hockey changes trigger this workflow
      - "scrapers/hockey/**"
      - ".github/workflows/hockey.yml"

permissions:
  contents: write

concurrency:
  group: hockey-scrape
  cancel-in-progress: false

jobs:
  gate:
    # Scheduled runs only continue if the Central clock reads 4:25 to 5:15 AM.
    # Manual runs and pushes always continue.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check Central time
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Not a scheduled run - continuing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          H=$(TZ=America/Chicago date +%-H)
          M=$(TZ=America/Chicago date +%-M)
          MINS=$((H * 60 + M))
          echo "Central time: $(TZ=America/Chicago date '+%H:%M %Z')"

          # 265 = 4:25 AM, 315 = 5:15 AM local. Tolerates GitHub start delays.
          if [ "$MINS" -ge 265 ] && [ "$MINS" -le 315 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside the 4:30 AM Central window - skipping this cron."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/hockey/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/hockey/requirements.txt

      # Cache the Chromium download, keyed on the installed Playwright version.
      # Keep this key identical in the diamondsports workflow so both share one cache.
      - name: Get Playwright version
        id: pw
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # The browser is cached, but the Ubuntu system libraries are not.
      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run hockey scraper
        env:
          ONLY: ${{ inputs.only_teams }}
          DEBUG: ${{ inputs.enable_debug }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi
          if [ "$DEBUG" = "true" ]; then
            ARGS+=(--debug)
          fi
          echo "Executing: python scrapers/hockey/scrape_hockey.py ${ARGS[*]}"
          python scrapers/hockey/scrape_hockey.py "${ARGS[@]}"

      - name: Upload debug snapshots
        if: ${{ inputs.enable_debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: hockey-debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit JSON
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/hockey
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(hockey): update stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Other sport workflows may push at the same time, so retry with a rebase.
          # changed=true is only set when the push actually succeeds.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
