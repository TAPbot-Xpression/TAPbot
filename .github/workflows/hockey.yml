name: Scrape Hockey

# Place this file at: .github/workflows/hockey.yml

on:
  schedule:
    # GitHub cron is UTC-only and cannot follow daylight saving time.
    # Two entries cover both seasons. The "gate" job below only lets the run
    # that lands around 4:00 AM in St. Paul (America/Chicago) continue.
    #   9:00 UTC = 4:00 AM CDT (mid-March to early November)
    #   10:00 UTC = 4:00 AM CST (early November to mid-March)
    - cron: " 9 * * *"
    - cron: " 10 * * *"
  workflow_dispatch:
    inputs:
      only_teams:
        description: "Teams to scrape (e.g. 'St. Thomas,Denver') or blank for all"
        required: false
        default: ""
        type: string
      enable_debug:
        description: "Save raw debug HTML snapshots (uploaded as an artifact)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:                          # only hockey changes trigger this workflow
      - "scrapers/hockey/**"
      - ".github/workflows/hockey.yml"

permissions:
  contents: write

concurrency:
  group: hockey-scrape
  cancel-in-progress: false

jobs:
  gate:
    # Scheduled runs only continue if the St. Paul clock reads about 4:30 AM.
    # Manual runs and pushes always continue.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check St. Paul local time
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Not a scheduled run - continuing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          H=$(TZ=America/Chicago date +%-H)
          M=$(TZ=America/Chicago date +%-M)
          MINS=$((H * 60 + M))
          echo "St. Paul local time: $(TZ=America/Chicago date '+%H:%M %Z')"

          # Accept 4:20 AM to 5:15 AM local, which tolerates GitHub start delays.
          if [ "$MINS" -ge 260 ] && [ "$MINS" -le 315 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside the 4:30 AM St. Paul window - skipping this cron."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/hockey/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/hockey/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run hockey scraper
        env:
          ONLY: ${{ inputs.only_teams }}
          DEBUG: ${{ inputs.enable_debug }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi
          if [ "$DEBUG" = "true" ]; then
            ARGS+=(--debug)
          fi
          echo "Executing: python scrapers/hockey/scrape_hockey.py ${ARGS[*]}"
          python scrapers/hockey/scrape_hockey.py "${ARGS[@]}"

      - name: Upload debug snapshots
        if: ${{ inputs.enable_debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: hockey-debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit JSON
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hockey
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(hockey): update stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Other sport workflows may push at the same time, so retry with a rebase.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
