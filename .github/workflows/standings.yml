name: Scrape Standings

# Place this file at: .github/workflows/standings.yml
# Scrapes standings, commits docs/standings/data.json, then redeploys the site
# (which publishes docs/standings/index.html along with everything else in docs/).
#
# Runs at 4:05 AM, 11:05 AM and 4:05 PM Central (St. Paul), all year.
#
# GitHub evaluates the cron in the America/Chicago timezone, so daylight saving
# is handled automatically. Minute :05 is used instead of :00 because GitHub
# delays jobs most at the top of the hour.

on:
  schedule:
    - cron: "5 4,11,16 * * *"     # 4:05 AM, 11:05 AM, 4:05 PM Central
      timezone: "America/Chicago"
  workflow_dispatch:
  push:
    branches: [main]
    paths:                          # only standings changes trigger this workflow
      - "scrapers/standings/**"
      - ".github/workflows/standings.yml"

permissions:
  contents: write

concurrency:
  group: standings-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/standings/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/standings/requirements.txt

      # Only installs a browser if the standings requirements.txt lists Playwright
      - name: Install Playwright browser (if needed)
        run: |
          if grep -qi "playwright" scrapers/standings/requirements.txt; then
            playwright install --with-deps chromium
          else
            echo "Playwright not in requirements.txt - skipping browser install."
          fi

      - name: Run standings scraper
        run: python scrapers/standings/scrape_standings.py

      - name: Commit JSON
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/standings
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(standings): update standings [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Other sport workflows may push at the same time, so retry with a rebase.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

  # Calls the shared deploy workflow, which publishes all of docs/ (including
  # docs/standings/index.html). Skipped when nothing changed.
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
