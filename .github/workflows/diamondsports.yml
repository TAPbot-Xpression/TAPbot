name: Scrape Diamond Sports

# Place this file at: .github/workflows/diamondsports.yml
# Scrapes Summit League baseball + softball and commits JSON to docs/diamondsports/
# Runs every morning at 3:45 AM Central (CST or CDT, depending on daylight saving).

on:
  schedule:
    # GitHub cron is UTC only and has no daylight saving support.
    # Both times are scheduled; the "Check Central time" step lets only the
    # one that lands on 3:45 AM Central through.
    - cron: "45 9 * * *"    # 3:45 AM CST (winter, UTC-6)
    - cron: "45 8 * * *"    # 3:45 AM CDT (summer, UTC-5)
  workflow_dispatch:
    inputs:
      sport:
        description: "Which sport to scrape"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - baseball
          - softball
      school:
        description: "One school only (e.g. omaha, omaha_softball, non_conf_baseball). Blank = all"
        required: false
        default: ""
        type: string
      year:
        description: "Season year (blank = script default)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:   # only diamond sports changes trigger this workflow
      - "scrapers/diamondsports/**"
      - ".github/workflows/diamondsports.yml"

permissions:
  contents: write

concurrency:
  group: diamondsports-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Check Central time
        id: tz
        run: |
          # Manual runs and push runs always go. Scheduled runs only go in the 3 AM Central hour.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=America/Chicago date +%H)
          echo "Central hour is $HOUR"
          if [ "$HOUR" = "03" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not the 3 AM Central hour. Skipping this run."
          fi

      - name: Checkout repository
        if: steps.tz.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.tz.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/diamondsports/requirements.txt

      - name: Install dependencies
        if: steps.tz.outputs.go == 'true'
        run: pip install -r scrapers/diamondsports/requirements.txt

      - name: Install Playwright browser
        if: steps.tz.outputs.go == 'true'
        run: playwright install --with-deps chromium

      - name: Run diamond sports scraper
        if: steps.tz.outputs.go == 'true'
        env:
          SPORT: ${{ inputs.sport }}
          SCHOOL: ${{ inputs.school }}
          YEAR: ${{ inputs.year }}
        run: |
          ARGS=()
          if [ -n "$SPORT" ] && [ "$SPORT" != "all" ]; then ARGS+=(--sport "$SPORT"); fi
          if [ -n "$SCHOOL" ]; then ARGS+=(--school "$SCHOOL"); fi
          if [ -n "$YEAR" ];   then ARGS+=(--year "$YEAR"); fi
          echo "Running: python scrapers/diamondsports/scrape_diamond_sports.py ${ARGS[*]}"
          python scrapers/diamondsports/scrape_diamond_sports.py "${ARGS[@]}"

      - name: Commit JSON
        id: commit
        if: steps.tz.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/diamondsports
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(diamondsports): update stats"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
