name: Deploy site

# Place this file at: .github/workflows/deploy.yml
#
# This is the ONLY workflow that publishes the website. Each sport's scraper
# workflow commits its JSON, then calls this one. Deploying one artifact of the
# whole docs/ folder keeps one sport's deploy from wiping out the others.

on:
  # Called by hockey.yml, basketball.yml, diamondsports.yml, standings.yml
  workflow_call:
  # Manual "Run workflow" button
  workflow_dispatch:
  # Redeploys when you edit any page or JSON by hand
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
