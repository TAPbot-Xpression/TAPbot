name: Scrape Summit Basketball

# Place this file at: .github/workflows/basketball.yml
# Scrapes Summit League men's and women's basketball and commits JSON to docs/basketball/

on:
  schedule:
    # GitHub cron runs in UTC. 14:45 UTC = 8:45 AM CST / 9:45 AM CDT in St. Paul.
    # Hockey runs at 14:15 and diamond sports at 14:30, so the pushes never collide.
    - cron: "45 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:                          # only basketball changes trigger this workflow
      - "scrapers/basketball/**"
      - ".github/workflows/basketball.yml"

permissions:
  contents: write

concurrency:
  group: basketball-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/basketball/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/basketball/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run basketball scraper
        run: python scrapers/basketball/scrape_basketball.py

      - name: Commit JSON
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/basketball
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(basketball): update stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Other sport workflows may push at the same time, so retry with a rebase.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
