name: Scrape Basketball

# Place this file at: .github/workflows/basketball.yml
# Scrapes Summit League men's and women's basketball and commits JSON to docs/basketball/
# Runs every morning at 3:30 AM Central Time (automatically adjusting for CST/CDT).

on:
  schedule:
    # Native IANA timezone evaluation (handles Daylight Saving Time automatically)
    - cron: '30 3 * * *'
      timezone: 'America/Chicago'

  workflow_dispatch:
    inputs:
      gender:
        description: "Gender to scrape"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - men
          - women
      only_teams:
        description: "Comma-separated team names/slugs (e.g. 'St. Thomas,Denver') or blank for all"
        required: false
        default: ""
        type: string

  push:
    branches: [main]
    paths:
      - "scrapers/basketball/**"
      - ".github/workflows/basketball.yml"

permissions:
  contents: write

concurrency:
  group: basketball-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/basketball/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/basketball/requirements.txt

      - name: Get Playwright version for cache key
        id: playwright-version
        run: |
          PW_VERSION=$(python -c "import playwright; print(playwright.__version__)")
          echo "version=${PW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium & system deps
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright browser cache hit. Installing OS dependencies only."
            playwright install-deps chromium
          else
            echo "Playwright cache miss. Installing browser and dependencies."
            playwright install --with-deps chromium
          fi

      - name: Run basketball scraper
        env:
          GENDER: ${{ inputs.gender }}
          ONLY: ${{ inputs.only_teams }}
        run: |
          ARGS=()
          if [ -n "$GENDER" ] && [ "$GENDER" != "all" ]; then
            ARGS+=(--gender "$GENDER")
          fi
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi

          echo "Running: python scrapers/basketball/scrape_basketball.py ${ARGS[*]}"
          python scrapers/basketball/scrape_basketball.py "${ARGS[@]}"

      - name: Commit JSON
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A docs/basketball

          if git diff --cached --quiet; then
            echo "No changes to commit (data is identical / cached)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(basketball): update stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Retry push with rebase in case another sport scraper commits concurrently
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "Failed to push after 3 attempts."
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
